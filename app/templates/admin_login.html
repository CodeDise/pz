{% extends "base.html" %}
{% block title %}Admin | {{ settings.APP_NAME }}{% endblock %}
{% block body %}
<div class="center-page">
  <form class="card-auth stack" method="post" action="/admin/login">
    <h1>Admin</h1>
    {% if err %}<div class="flash err" role="alert" style="margin:0">{{ err }}</div>{% endif %}
    <div class="field"><label for="token">Admin token</label><input class="input mono" id="token" name="token" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-block" type="submit">Enter</button>
  </form>
</div>
{% endblock %}
