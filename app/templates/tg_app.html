{% extends "base.html" %}
{% block title %}{{ settings.APP_NAME }}{% endblock %}
{% block head %}<script src="https://telegram.org/js/telegram-web-app.js"></script>{% endblock %}
{% block body %}
<div class="center-page">
  <div class="card-auth stack">
    <a class="brand" href="/"><span class="brand-mark">P</span>{{ settings.APP_NAME }}</a>
    <p id="msg" class="muted">Signing you in...</p>
    <a id="fallback" class="btn btn-ghost hide" href="/login">Log in another way</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  function fail(text) {
    document.getElementById('msg').textContent = text;
    document.getElementById('fallback').classList.remove('hide');
  }
  if (!tg || !tg.initData) { fail('Open this page from the Telegram bot to sign in automatically.'); return; }
  tg.ready(); tg.expand();
  fetch('/auth/webapp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData: tg.initData }),
    credentials: 'same-origin'
  }).then(function (r) {
    if (r.ok) { location.replace('/dashboard'); } else { fail('Telegram sign-in failed. Send /dashboard to the bot and use the browser link.'); }
  }).catch(function () { fail('Could not reach the server. Try again in a moment.'); });
})();
</script>
{% endblock %}
